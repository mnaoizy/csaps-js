name: Publish

# Publishes to npm when a version tag (e.g. v0.1.0) is pushed.
# Requires a repository secret named NPM_TOKEN (an npm automation access token).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # enables npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # `--provenance` requires a public repository; drop it if the repo is private.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
